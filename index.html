<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>配布サイト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f6f7fb;
      color: #222;
      padding: 20px;
    }

    .section-title {
      font-size: 30px;
      font-weight: bold;
      margin: 20px 0 8px 0;
    }

    .dropdown {
      width: 100%;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .dropdown-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background: #fff;
      transition: background 0.2s;
      padding: 10px 12px;
      font-size: 16px;
      font-weight: 500;
    }
    .dropdown-header:hover {
      background: #f2f3f5;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dropdown-header .arrow {
      display: inline-block;
      transition: transform 0.2s ease;
      transform: rotate(0deg);
    }
    .dropdown.open .dropdown-header .arrow {
      transform: rotate(90deg);
    }

    .dropdown-date {
      font-size: 12px;
      color: #888;
      margin-left: auto;
      white-space: nowrap;
    }

    .dropdown-content {
      display: none;
      padding: 8px 16px;
      border-top: 1px solid #eee;
    }
    .dropdown.open > .dropdown-content {
      display: block;
    }

    .btn1 {
      display: inline-block;
      background: #4564ff;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      color: #ffffff;
      transition: background 0.15s;
      margin: 4px 0;
    }

    .btn {
      display: inline-block;
      background: #efefef;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      color: #222;
      transition: background 0.15s;
      margin: 4px 0;
    }
    .btn:hover {
      background: #e2e2e2;
    }

    .text {
      display: block;
      margin: 6px 0;
      font-size: 14px;
      color: #000;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="section-title">配布サイト</div>
  <a class="btn1" href="https://forms.gle/3YJZMnzbksPotz6S7">フォームはこちら</a>
  <div class="text">
    問題が起きても対応しない可能性があります。<br>
  </div>

  <div id="main-container">
    <div class="dropdown" id="適当に作ったScratchです" data-date="2025-09-21">
      <div class="dropdown-header">
        <div class="header-left">
          <span class="arrow">▶</span>
          適当に作ったScratchです
        </div>
        <div class="dropdown-date"></div>
      </div>
      <div class="dropdown-content">
        <a class="btn" href="https://github.com/sukinakoto-reimusan/sukinakotosikasinai-reimusan/releases/download/main/Scratch_data_1.sb3">
          Scratchのプロジェクトのダウンロードリンク
        </a>
      </div>
    </div>
  </div>

  <script>
    // ▼ ドロップダウン開閉
    function setupDropdowns(root=document) {
      root.querySelectorAll('.dropdown-header').forEach(header => {
        header.addEventListener('click', () => {
          header.parentElement.classList.toggle('open');
        });
      });

      root.querySelectorAll('.dropdown').forEach(dropdown => {
        const date = dropdown.getAttribute('data-date');
        if (date) {
          const dateElement = dropdown.querySelector('.dropdown-date');
          if (dateElement) dateElement.textContent = date;
        }
      });
    }
    setupDropdowns();

    // ▼ GETパラメータで指定されたIDを開く & スクロール
    const params = new URLSearchParams(window.location.search);
    const targetId = params.get("id");
    if (targetId) {
      const target = document.getElementById(targetId);
      if (target) {
        target.classList.add("open");
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    // ▼ サブフォルダの index.html を読み込む
    async function loadSubfolders() {
      try {
        const res = await fetch("./");
        const text = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, "text/html");
        const links = [...doc.querySelectorAll("a")]
          .map(a => a.getAttribute("href"))
          .filter(href => href && href.endsWith("/"));

        const dropdowns = [];
        for (const folder of links) {
          try {
            const htmlRes = await fetch(folder + "index.html");
            if (!htmlRes.ok) continue;
            const htmlText = await htmlRes.text();
            const htmlDoc = parser.parseFromString(htmlText, "text/html");
            htmlDoc.querySelectorAll(".dropdown").forEach(el => {
              dropdowns.push(el);
            });
          } catch (err) {
            console.warn("フォルダ読み込み失敗:", folder, err);
          }
        }

        // 日付でソート（降順）
        dropdowns.sort((a, b) => {
          const da = a.getAttribute("data-date") || "";
          const db = b.getAttribute("data-date") || "";
          return db.localeCompare(da);
        });

        const container = document.getElementById("main-container");
        dropdowns.forEach(el => container.prepend(el));
        setupDropdowns(document); // 新しく追加した要素にもイベント設定
      } catch (e) {
        console.error("フォルダ一覧取得失敗", e);
      }
    }
    loadSubfolders();
  </script>
</body>
</html>
